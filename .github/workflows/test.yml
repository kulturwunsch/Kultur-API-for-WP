name: Continious Integration 
permissions:
  contents: read

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - 'main'

jobs:
  matrixtest:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Check PHP Syntax
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l -n | (! grep -v 'No syntax errors detected')
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    needs: ['matrixtest']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit:9.6
      - name: Install Composer
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php-versions }}
          dev: yes
      - name: Run unit tests
        run: phpunit -c tests/phpunit.xml
      - name: Run PHPStan Code-Tests
        uses: php-actions/phpstan@v3
        with:
          path: ./
          level: 6
          php_version: ${{ matrix.php-versions }}
  build:
    name: Test and build plugin
    runs-on: ubuntu-latest 
    needs: ['matrixtest']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Minify public JavaScript files
        uses: nizarmah/auto-minify@v3
        with:
          directory: 'public/js'
          overwrite: true
      - name: Minify public Stylesheets
        uses: nizarmah/auto-minify@v3
        with:
          directory: 'public/css'
          overwrite: true
      - name: Minify admin JavaScript files
        uses: nizarmah/auto-minify@v3
        with:
          directory: 'admin/js'
          overwrite: true
      - name: Minify admin Stylesheets
        uses: nizarmah/auto-minify@v3
        with:
          directory: 'admin/css'
          overwrite: true
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
            php-version: latest
            coverage: none
            tools: composer
      - name: Install build dependencies
        env:
          COMPOSER_HOME: ${{ runner.temp }}/wp-cli-composer
        run: env -u GITHUB_TOKEN -u COMPOSER_AUTH composer install --no-interaction --prefer-dist
      - name: Build plugin
        run: |
          vendor/bin/wp dist-archive . ./kultur-api-for-wp.zip
          mkdir tmp-build
          unzip kultur-api-for-wp.zip -d tmp-build
      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1.1.5
        with:
          build-dir: './tmp-build/Kultur-API-for-WP'
          slug: 'kultur-api-for-wp'
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: kultur-api-for-wp
          path: kultur-api-for-wp.zip
          if-no-files-found: error
          retention-days: 14